<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List 2</title>
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1>To-Do List</h1>
      <div class="entrada">
        <form id="formTarefa">
          <input
            type="text"
            placeholder="Nome da tarefa..."
            id="campoEntrada"
          />
          <button>Adicionar</button>
        </form>
      </div>

      <div>
        <h3>Tarefas</h3>
        <ul id="listaTarefas"></ul>
      </div>
    </div>
  </body>
</html>


<!-- RESPOSTAS:

    Questão 01: Usar <script src="index.js" defer></script>. O defer faz o script esperar o carregamento do HTML.

    Questão 02:
    I > B
    II > C
    III > A

    Questão 03: Foi usado classList.add(). O classList permite adicionar, remover e alterar classes CSS de um elemento.

    Questão 04: createElement() cria um novo elemento HTML. Recebe como argumento o nome da tag, como "li", "span" ou "button".

    Questão 05: b) innerText trabalha com texto, enquanto innerHTML trabalha com conteúdo HTML, incluindo tags.

    Questão 06: Foi usado o atributo onclick. Ele recebe uma função que será executada quando o elemento for clicado.

    Questão 07: addEventListener() adiciona um evento a um elemento. Ele recebe principalmente o tipo do evento (como "click" ou "submit") e uma função que será executada quando o evento acontecer.
 -->
