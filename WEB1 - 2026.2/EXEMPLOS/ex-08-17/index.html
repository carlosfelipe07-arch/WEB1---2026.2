<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./main.js" defer></script>
  </head>

  <body>
    <header>
      <h1>Cadastro de Usuário</h1>
    </header>

    <main>
      <section>
        <h2>Bem-vindo ao RetroMarket!</h2>

        <p>Preencha o formulário abaixo para realizar seu cadastro.</p>

        <img
          src="https://images.unsplash.com/photo-1623910270913-3e0294a1c765?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Imagem ilustrativa da página de cadastro"
          id="imgPreferencia"
        />
      </section>

      <section>
        <h2>Formulário de Cadastro</h2>

        <form id="formCadastro">
          <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required />
          </div>

          <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required />
          </div>

          <div>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" min="1" />
          </div>

          <div>
            <label for="idade">Link de uma imagem do seu jogo favorito:</label>
            <input type="url" id="urlImagem" name="urlImagem" />
          </div>

          <button type="submit">Cadastrar</button>
        </form>
      </section>

      <section id="sectionDados">
        <h2>Dados Cadastrados:</h2>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 - Página de Cadastro</p>
    </footer>
  </body>
</html>
